[workspace]
resolver = "3"
members = ["crates/ux2-panel", "crates/ux2ctl"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/jazzjackrabb1t/ux2-panel"
rust-version = "1.85"
authors = ["Doruk Dede <dorukdede93@gmail.com>"]

[workspace.dependencies]
ux2-panel = { path = "crates/ux2-panel", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_qualifications = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
strip = true
